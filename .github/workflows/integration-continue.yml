name: L'intégration continue
permissions: {}

on: pull_request

jobs:
  build:
    name: Construction du site

    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt Git
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Installe Node.js, pnpm et les dépendances
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
          node-version-file: '.nvmrc'

      - name: Vérfie le typage
        run: pnpm typecheck

      - name: Lint le projet
        run: pnpm lint

      - name: Exécute les tests
        run: pnpm test:ci
