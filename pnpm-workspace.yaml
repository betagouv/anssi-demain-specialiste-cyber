color: always

packages:
  - 'back'
  - 'front'

minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
minimumReleaseAgeExclude:
  - '@lab-anssi/ui-kit'
  # Renovate security update: qs@6.16.1
  - qs@6.16.1

preferFrozenLockfile: true
strictDepBuilds: false

allowBuilds:
  '@lab-anssi/lib': false
  '@lab-anssi/ui-kit': false
  '@parcel/watcher': false
  bcrypt: false
  esbuild: false
  unrs-resolver: false
