color: always

overrides:
  'multer@<2.1.1': '>=2.1.1'
  'immutable@>=5.0.0 <5.1.5': '>=5.1.5'
  'devalue@<5.6.4': '>=5.6.4'
  'flatted@<=3.4.1': '>=3.4.2'
  'handlebars@<=4.7.8': '>=4.7.9'
  'picomatch@<2.3.2': '>=2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'path-to-regexp@<0.1.13': 0.2.5
  'brace-expansion@<1.1.13': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.5': '>=5.0.5'
  'yaml@>=1.0.0 <1.10.3': '>=1.10.3'
  'vite@>=7.0.0 <=7.3.1': 7.3.7
  'follow-redirects@<=1.15.11': '>=1.16.0'
  'postcss@<8.5.10': '>=8.5.10'
  'axios@>=1.0.0 <1.15.2': '>=1.15.2'
  'fast-xml-builder@<=1.1.6': '>=1.1.7'

packages:
  - 'back'
  - 'front'

minimumReleaseAge: 10080 # 7 jours (exprimé en minutes)
minimumReleaseAgeExclude:
  - '@lab-anssi/ui-kit'
  # Renovate security update: qs@6.16.1
  - qs@6.16.1

preferFrozenLockfile: true
strictDepBuilds: false

allowBuilds:
  '@lab-anssi/lib': false
  '@lab-anssi/ui-kit': false
  '@parcel/watcher': false
  bcrypt: false
  esbuild: false
  unrs-resolver: false
